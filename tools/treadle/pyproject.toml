[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treadle"
version = "0.4.1"
description = "Deterministic driver for evidence-disciplined formal programmes: walks the swarm board, calls one model per gated stage, accepts only what the deterministic gate passes."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
treadle = "treadle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
