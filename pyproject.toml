[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepreason"
version = "0.1.0"
description = "DeepReason V6-only deterministic reasoning harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Neural embedder backend (src/deepreason/llm/embedder.py). CORE, not
    # optional: config.EMBEDDER_MODEL defaults to a neural model, and an
    # absent backend degrades every run to HashingEmbedder under
    # EMBEDDER_FAILURE_POLICY="fallback" — a typed `embedder-fallback`
    # measure that no reader was looking at. The default must be armed by
    # the same install that arms the harness.
    "fastembed>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# Browser oracle (src/deepreason/browser.py): headless-Chromium evaluation of
# single-file web-app candidates. Optional — the harness runs without it.
browser = [
    "playwright>=1.45",
]
# Neural embedder: EMPTY ALIAS. fastembed moved into the core dependency
# list above, so `pip install -e .` already carries it. The group is kept
# declared — not deleted — because `pip install 'deepreason[embed]'` appears
# in committed ladders, handovers and experiment records; an undeclared
# extra makes those a resolution error rather than a no-op.
embed = []
# Evidence admission adapters (docs/ADMISSION_SPEC.md §3a): first-party
# PDF extraction behind the same plugin contract third parties use. A
# missing extra is a typed admission refusal naming deepreason[admit].
admit = [
    "pypdf>=4.0",
]

[project.entry-points."deepreason.admission.adapters"]
epub = "deepreason.admission.adapters_epub:MANIFEST"
pdf = "deepreason.admission.adapters_pdf:MANIFEST"

[project.scripts]
deepreason = "deepreason.cli.main:main"
deepreason-mcp = "deepreason.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepreason", "mini/minireason"]

[tool.pytest.ini_options]
testpaths = ["tests", "mini/tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "mini"]
