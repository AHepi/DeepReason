schema: deepreason-omnibus-prereg.v1
block: A-2
title: criticism-symmetry pilot cells, corrected (S6-proven budget shape)
serves: corrects Block A's budget confound (RESULTS.md, Block A segment); docs/proposals/CRITICISM_SYMMETRY_RESEARCH_PREPLAN.md P1, P2
frozen_at: 2026-08-09T00:00:00Z  # before the first live call of this block
status: FROZEN
supersedes_measurement_of: block-a-criticism-symmetry (the pilot cells, not the block -- Block A's PARKED.md P1 reverse-arm gap and its own residue items stand unchanged)

why_this_block_exists:
  Block A's own RESULTS.md segment named its 6-cycle/90000-token
  budget as a confound: it produced zero refutations in 10/10
  completed runs (P1 untestable, no variance) and a
  "foreign-criticism" coverage-validation violation in both cells
  (SELF 3/6 clean, CROSS 0/6 clean) that looked like it could be
  budget-tightness rather than a self/cross effect. This block re-runs
  the SAME design at the S6-proven budget shape (10 cycles / 195000
  tokens, the shape that reliably produced replay-valid completions in
  Rung S6's own two-model A/B) so the comparison the operator asked
  for in Block A can actually be trusted.

design:
  cells:
    SELF:
      home: REUSE experiments/2026-08-09-overnight-omnibus/block-a-criticism-symmetry/home-self
      setup: unchanged from Block A (default glm-5.2 profile, no seat override) -- qualification cache-hits, same profile digest
    CROSS:
      home: REUSE experiments/2026-08-09-overnight-omnibus/block-a-criticism-symmetry/home-cross
      setup: unchanged from Block A (--seat conjecture=<gemma4:31b profile>) -- qualification cache-hits, same profile digest and same coder-profile.yaml file (byte-identical, not regenerated)

  questions: [Q1, Q2]  # IDENTICAL text to Block A's block_a_questions.py, copied verbatim into this block's own block_a2_questions.py for self-containment
  seeds_baseline: [S1, S2, S3]  # same distinguishing-sentence pattern, IDENTICAL prefixes to Block A's -- this mints a DIFFERENT run_id than Block A's own runs only because the token_budget input to _request_digest differs (195000 vs 90000), not because of any question-text change
  seeds_extra_cross_q1: [S4, S5, S6, S7]  # 4 NEW distinguishing-sentence seeds, CROSS cell + Q1 ONLY, to size the V6_ROUTE_SEAT_INSUFFICIENT_CAPABILITY refusal rate at the corrected budget on a larger n
  cells_x_questions_x_seeds: (2 cells x 2 questions x 3 seeds) + (1 cell x 1 question x 4 extra seeds) = 12 + 4 = 16 runs

  budget_per_run:
    cycles: 10
    token_budget: 195000
    flags: "--allow-partial"
    rationale: S6-proven shape (experiments/2026-08-08-live-two-seat-ab-s6), the exact cycles/budget that produced replay-valid completions there.

  convergence_protocol:
    description: >
      success criterion is a REPLAY-VALID final state, not a fast
      stop. After the initial `reason` call: if verify_root shows
      replay_valid=true, done. Else, if stop_reason is in
      {"converged","budget_exhausted"} (RESUMABLE_STOP_REASONS,
      workflow/lifecycle.py:28), run `deepreason --root <root> continue
      --budget cycles=2`, then re-check replay_valid. Repeat up to a
      TOTAL of 2 continue calls per run (3 attempts at reaching valid
      state total: the original reason call plus 2 continues). If at
      any point the stop_reason is NOT in RESUMABLE_STOP_REASONS
      (e.g. operational_failure), stop immediately -- do not attempt
      to continue a non-resumable stop.
    max_continues_per_run: 2
    stop_condition: "replay_valid=true, OR non-resumable stop_reason, OR max_continues exhausted"

blob_before_theory:
  # CLAUDE.md's hard-won invariant: read the diagnostic blob before
  # theorising about a cycle-0-style failure. Done BEFORE this
  # PREREG's extra-attempts design, per the operator's explicit
  # instruction.
  source_run: block-a-criticism-symmetry/home-cross/runs/run-6ffa0a9e06186d5e5d2bb19ad68d25d2 (Block A's CROSS q1s1)
  verbatim_error: >
    {"contract": "critic.atomic-target.v1", "path": "/counterexample",
    "error": "Input should be a valid list", "received": "A panel of
    non-experts follows a checklist that forces thorough System 2
    search, but the checklist items are incomplete or biased relative
    to the task's objective verification criteria; the expert's
    intuition, though System 1, happens to embody domain knowledge
    that the checklist omits. In that single evaluation, the panel's
    System 2 compliance produces less reliable judgments than the
    expert, showing that forcing systematic search is not equivalent
    to a genuine reliability gain. This satisfies the target's stated
    mechanism while contradicting its implied reliability superiority,
    and it is exactly the kind of evidence the problem asks to
    distinguish from genuine reliability.", "allowed": "",
    "repair_scope": "/counterexample", "skeleton": []}
    (from blobs/a6/a672570b844bb3f8771ab8eb187c49aeb98070e62719a0b97ddfeba5e2620aa7,
    diagnostic_ref of an argumentative_critic attempt at seq 50)
  what_it_shows: >
    the FAILING role is `argumentative_critic` on the DEFAULT glm-5.2
    profile (endpoint_id provider-profile-a3e4b48c... == home-cross's
    own provider.yaml, family glm -- confirmed by cross-referencing
    log.jsonl's llm.model field, which reads "glm-5.2" for this exact
    role/endpoint), critiquing contract `critic.atomic-target.v1`.
    The model returned a full prose paragraph (an argued
    counterexample IN WORDS) where the contract's `/counterexample`
    field requires a LIST. This is a schema-shape failure by the
    CRITIC, not a token-exhaustion failure by the conjecturer -- three
    attempts at this exact contract are visible in the run's
    attempt_trace, all `"valid": false`, before the route seat gave up
    with V6_ROUTE_SEAT_INSUFFICIENT_CAPABILITY. Whether glm-5.2
    produces this shape mismatch MORE often when critiquing a
    gemma4:31b-authored conjecture than a glm-5.2-authored one is
    exactly what the 4 extra CROSS-Q1 attempts below are designed to
    size -- not yet known, not theorized further here.
  implication_for_design: >
    the extra attempts do NOT need a new question or contract design
    -- the SAME Q1 text and SAME critic.atomic-target.v1 contract
    already reproduces the failure shape; more seeds at the same
    (question, contract, cell) combination is the right instrument to
    size the rate.

metrics: [refutation_rate, criticism_calls_per_accepted_artifact,
          criticism_tokens_per_accepted_artifact, survival_distribution
          (stop_reason histogram), foreign_criticism_debt_at_natural_stop,
          continuation_count_per_run (0/1/2), final_replay_valid_rate,
          same_question_refusal_rate (CROSS Q1 only, n=7: 3 baseline +
          4 extra, reported separately from Block A's own n=3 at the
          OLD budget -- NOT pooled, since budget differs and pooling
          would reintroduce the very confound this block exists to
          remove)]

hit_criteria:
  P1_testable_this_time: "at least 1 refutation occurs across the 16 runs -- if still 0/16, P1 remains untestable at this question's difficulty even at S6's proven budget, and that is itself reported, not hidden"
  P2_verdict: "reported as a DISTRIBUTION comparison (full per-run values for both criticism_calls_per_accepted_artifact and criticism_tokens_per_accepted_artifact, both cells), not a means-only claim -- an explicit verdict on direction is given only if the distributions are separated enough to say so honestly"
  refusal_rate_sizing: "CROSS-Q1 refusal rate at 10cyc/195k reported out of n=7 (3 baseline + 4 extra), with the exact blob evidence above carried into RESULTS.md verbatim"
  reporting_floor: "16 runs total is still a pilot; this block corrects ONE confound (budget), not every limitation Block A's residue already named (no reverse arm, n too small for a fully powered P1/P2 test)"

parked_unchanged: block-a-criticism-symmetry/PARKED.md P1 (no critic-seat group; reverse arm still impossible) -- this block does not attempt it and does not need to re-state the ready prompt, already on record.
