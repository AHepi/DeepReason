schema: deepreason-omnibus-prereg.v1
block: C
title: reasoning-token completion-cap curve
serves: docs/TOKEN_ECONOMY.md; CLAUDE.md's "raise --maximum-completion-tokens" guidance
frozen_at: 2026-08-09T00:00:00Z  # before the first live call of this block
status: FROZEN

design:
  caps: [4096, 8192, 16384]  # --maximum-completion-tokens; each is a fresh provider-profile digest -> one full qualification battery each (~14 min, ~1160 calls), budgeted knowingly
  seeds_per_cap: 2            # distinguishing leading sentence only (S6/_request_digest pattern); shares the cap's home so the second seed's qualification cache-hits
  question: one fixed hard argumentative claim (same text as Block A's Q1, block_c_question.py), --reasoning none, glm-5.2 default profile (no seat overrides -- this block isolates the completion-cap variable alone)
  budget_per_run:
    cycles: 6
    token_budget: 90000
    flags: "--allow-partial"
  homes: [home-4096, home-8192, home-16384]  # one per cap, never shared -- cap change = profile digest change = mandatory fresh battery regardless of home reuse, so separate homes just keep the roots organized per cap

metrics:
  - typed_seat_failure_rate: fraction of runs whose harness.workflow_state.insufficient_capability_by_route_seat is non-empty at stop (V6_ROUTE_SEAT_INSUFFICIENT_CAPABILITY, src/deepreason/workflow/transaction_service.py + llm/adapter.py:466-471)
  - empty_emission_rate: fraction of LLM calls with event.llm.truncated == True (spent the call's completion-token cap) per run, and whether any such call produced zero usable output
  - qualification_tier_reached: qualify --json output's qualification_state per cap (full / ready_shallow / unqualified)
  - run_survival_stats: stop_reason histogram, cycles actually run, artifact/event counts, verify_root cleanliness, per cap

hit_criteria:
  curve_shape: "typed_seat_failure_rate and empty_emission_rate should fall monotonically as cap rises 4096 -> 8192 -> 16384; a non-monotonic result is reported as-is, not smoothed"
  reporting_floor: "2 seeds/cap is a pilot curve (3 points), not a statistically powered study -- explicitly scoped as a pilot informing TOKEN_ECONOMY.md, per the operator's own Block C framing"
